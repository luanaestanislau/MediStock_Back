name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Gerar segredos de teste
        # Segredos descartaveis so para o contexto Spring subir nos testes
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "GEMINI_API_KEY=ci-dummy" >> "$GITHUB_ENV"

      - name: Build e testes
        env:
          AUTOMACAO_HABILITADA: 'false'
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: medistock-backend-jar
          path: target/*.jar
          retention-days: 7
