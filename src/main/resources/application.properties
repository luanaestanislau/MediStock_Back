spring.application.name=medistockbackend
server.port=8080

# Banco de dados: SQLite 
spring.datasource.url=jdbc:sqlite:medistock.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# update = cria/ajusta as tabelas automaticamente a partir das entidades.
# Trocar para "validate" quando o schema estiver estavel em producao.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - em producao, mover para variavel de ambiente (nunca commitar segredo
# real). Este valor serve apenas para desenvolvimento local.
medistock.jwt.secret=${JWT_SECRET}
medistock.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Dominios institucionais aceitos no cadastro/login (Smart HAS)
medistock.auth.dominios-permitidos=hc.unicamp.br,hc.usp.br,einstein.br,hospital.gov.br,saude.sp.gov.br

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs