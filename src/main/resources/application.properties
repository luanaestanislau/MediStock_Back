spring.application.name=medistockbackend
server.port=8080
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Banco de dados: SQLite 
spring.datasource.url=jdbc:sqlite:medistock.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# update = cria/ajusta as tabelas automaticamente a partir das entidades.
# Trocar para "validate" quando o schema estiver estavel em producao.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

medistock.jwt.secret=${JWT_SECRET}
medistock.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Dominios institucionais aceitos no cadastro/login (Smart HAS)
medistock.auth.dominios-permitidos=fiap.com.br,hc.unicamp.br,hc.usp.br,einstein.br,hospital.gov.br,saude.sp.gov.br

# Origens aceitas pelo CORS, separadas por virgula (ex.: http://localhost:4200,http://localhost:8081)
medistock.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# Configuracoes de integracao com a IA Gemini
medistock.gemini.api-key=${GEMINI_API_KEY}
medistock.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
medistock.gemini.timeout=10s

# Logs (Smart HAS): console + arquivo rotativo em logs/, com X-Request-Id em cada linha
logging.file.name=logs/medistock.log
logging.pattern.level=%5p [%X{requestId:-}]
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.level.br.com.fiap.medistockbackend=INFO

# Auditoria: dias que os registros ficam guardados antes do expurgo automatico
medistock.auditoria.retencao-dias=${AUDITORIA_RETENCAO_DIAS:365}

# Automacoes agendadas (cron Spring: seg min hora dia mes dia-semana)
medistock.automacao.habilitada=${AUTOMACAO_HABILITADA:true}
medistock.automacao.zona=America/Sao_Paulo
medistock.automacao.varredura-alertas.cron=0 0 * * * *
medistock.automacao.expurgo-auditoria.cron=0 30 3 * * *
